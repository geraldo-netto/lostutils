name: CI

on:
  push:
    branches:
      - develop
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Python 3.12
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-ci.txt

      - name: Install CI dependencies
        run: python -m pip install --disable-pip-version-check -r requirements-ci.txt

      - name: Lint root scripts
        run: ruff check *.py

      - name: Type-check root scripts
        run: pyright --pythonpath "$(command -v python)" *.py

      - name: Run unit, regression, integration, and fuzz tests
        run: |
          xvfb-run -a coverage run -m pytest -q
          xvfb-run -a coverage run --append -m pytest -q tests/fuzz/fuzz_*.py tests/fuzz_*.py

      - name: Enforce coverage gates
        run: |
          coverage report
          coverage json
          python tests/check_function_coverage.py coverage.json --minimum 80
